name: Build

on:
  push:
    branches:
      - master

  pull_request:
    types: [opened, synchronize, reopened]

env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: ${{ secrets.MONGODB_DB }}

jobs:
  tests:
    name: Run coverage tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm --prefix users ci
      - run: npm --prefix webapp ci

      - run: npm --prefix users run test:coverage
      - run: npm --prefix webapp run test:coverage
      

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate gamey code coverage
        run: cd gamey && cargo llvm-cov --lcov --output-path lcov.info

      - name: Normalize coverage paths
        run: |
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" gamey/lcov.info || true
          
          # Webapp: resolve absolute paths, or prefix relative paths with webapp/
          if [ -f "webapp/coverage/lcov.info" ]; then
            sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" webapp/coverage/lcov.info
            sed -i '/^SF:webapp\//! s|^SF:\(.*\)|SF:webapp/\1|g' webapp/coverage/lcov.info
          fi
          
          # Users: resolve absolute paths, or prefix relative paths with users/
          if [ -f "users/coverage/lcov.info" ]; then
            sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" users/coverage/lcov.info
            sed -i '/^SF:users\//! s|^SF:\(.*\)|SF:users/\1|g' users/coverage/lcov.info
          fi
          
          grep '^SF:' webapp/coverage/lcov.info || true

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-carga:
    name: Run load tests (Gatling)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Gatling Tests
        working-directory: ./testCarga
        run: mvn gatling:test