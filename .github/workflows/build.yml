name: Build

on:
  push:
    branches:
      - master

  pull_request:
    types: [opened, synchronize, reopened]

env:
  MONGODB_URI: ${{ secrets.MONGODB_URI }}
  MONGODB_DB: ${{ secrets.MONGODB_DB }}

jobs:
  tests:
    name: Run coverage tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm --prefix users ci
      - run: npm --prefix webapp ci

      - run: npm --prefix users run test:coverage
      - run: npm --prefix webapp run test:coverage
      

      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked

      - name: Generate gamey code coverage
        run: cd gamey && cargo llvm-cov --lcov --output-path lcov.info

      - name: Normalize Rust coverage paths
        run: |
          sed -i "s|SF:${GITHUB_WORKSPACE}/|SF:|g" gamey/lcov.info
          grep '^SF:' gamey/lcov.info | head

      - name: Analyze with SonarQube
        uses: SonarSource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test-carga:
    name: Run load tests (Gatling)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Run Gatling Tests
        run: mvnw gatling:test -Dgatling.simulationClass=io.gatling.demo.UserList