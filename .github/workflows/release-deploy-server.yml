name: Release — Test, Build, Publish, Deploy

on:
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_TAG: ${{ github.event.release.tag_name }}

jobs:
  test-node:
    name: Run node unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [webapp, users]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: |
          cd ${{ matrix.service }}
          npm ci

      - name: Run tests
        run: |
          cd ${{ matrix.service }}
          npm test

  test-rust:
    name: Run rust (gamey) tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run tests
        run: |
          cd gamey
          cargo test

  e2e:
    name: Run E2E tests
    runs-on: ubuntu-latest
    needs: [test-node, test-rust]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install users dependencies
        run: |
          cd users
          npm ci

      - name: Install webapp dependencies
        run: |
          cd webapp
          npm ci

      - name: Install Playwright browsers
        run: |
          cd webapp
          npm run test:e2e:install-browsers

      - name: Run E2E tests (start servers and run cucumber)
        run: |
          cd webapp
          npm run test:e2e

  docker-push-users:
    name: Publish users image
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push users image
        uses: docker/build-push-action@v5
        with:
          context: ./users
          platforms: linux/arm64
          push: true
          tags: ghcr.io/arquisoft/${{ github.event.repository.name }}-users:latest
          cache-from: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache
          cache-to: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache,mode=max

  docker-push-webapp:
    name: Publish webapp image
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push webapp image
        uses: docker/build-push-action@v5
        with:
          context: ./webapp
          platforms: linux/arm64
          push: true
          tags: ghcr.io/arquisoft/${{ github.event.repository.name }}-users:latest
          build-args: |
            VITE_API_URL=http://${{ secrets.DEPLOY_HOST }}:3000
          cache-from: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache
          cache-to: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache,mode=max

  docker-push-gamey:
    name: Publish gamey image
    runs-on: ubuntu-latest
    needs: e2e
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push gamey image
        uses: docker/build-push-action@v5
        with:
          context: ./gamey
          platforms: linux/arm64
          push: true
          tags: ghcr.io/arquisoft/${{ github.event.repository.name }}-users:latest
          cache-from: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache
          cache-to: type=registry,ref=ghcr.io/arquisoft/${{ github.event.repository.name }}-users:cache,mode=max
  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: [docker-push-users, docker-push-webapp, docker-push-gamey]
    steps:
      - name: Deploy over SSH
        uses: fifsky/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          user: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          command: |
            wget https://raw.githubusercontent.com/${{ github.repository_owner }}/${{ github.event.repository.name }}/${{ github.event.release.target_commitish }}/docker-compose.yml -O docker-compose.yml
            docker compose down
            docker compose up -d --pull always