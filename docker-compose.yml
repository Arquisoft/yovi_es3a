services:
  users:
    container_name: users
    image: ghcr.io/arquisoft/yovi_es3a-users:${IMAGE_TAG}-arm64
    ports:
      - "3000:3000"
    networks:
      - monitor-net
    environment:
      - MONGODB_DB=${MONGODB_DB}
      - MONGODB_URI=${MONGODB_URI}
    
  webapp:
    container_name: webapp
    image: ghcr.io/arquisoft/yovi_es3a-webapp:${IMAGE_TAG}-arm64
    ports:
      - "80:80"
    networks:
      - monitor-net
    depends_on:
      - users

  gamey:
    container_name: gamey
    build: ./gamey
    image: ghcr.io/arquisoft/yovi_es3a-gamey:${IMAGE_TAG}-arm64
    ports:
      - "4000:4000"
    networks:
      - monitor-net
    depends_on:
      - users

  prometheus:
    container_name: prometheus
    image: prom/prometheus
    ports:
      - "9090:9090"
    networks:
      - monitor-net
    volumes:
      - /home/github-actions/users/monitoring/prometheus:/etc/prometheus

  grafana:
    container_name: grafana
    image: grafana/grafana
    ports:
      - "9091:3000"
    networks:
      - monitor-net
    volumes:
      - ./users/monitoring/grafana/provisioning:/etc/grafana/provisioning

networks:
  monitor-net:
    driver: bridge